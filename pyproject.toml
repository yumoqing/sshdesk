[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshdesk"
version = "0.1.0"
description = "Windows 上的 SSH/SFTP 客户端：多标签终端 + 文件上传下载 + 跳板机 + 密码/密钥登录"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6-Essentials>=6.6",
  "paramiko>=3.4",
  "pyte>=0.8",
  "wcwidth",
]

[project.scripts]
sshdesk = "sshdesk.app:main"

[tool.setuptools.packages.find]
include = ["sshdesk*"]
