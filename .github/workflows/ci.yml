name: ci

on:
  push:
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 Qt 运行时依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-noto-cjk

      - name: 安装依赖（界面来自 bricks-qt）
        run: |
          python -m pip install -U pip
          pip install PySide6-Essentials pyte wcwidth json5 paramiko asyncssh jinja2
          pip install "git+https://github.com/yumoqing/bricks-qt@main"

      - name: .ui 构建校验（有未适配控件即失败）
        shell: bash
        run: |
          for f in sshdesk/ui/*.ui; do
            echo "== $f"
            python -m bricks_qt.cli check "$f" --strict
          done

      - name: 窗口自检（bricks 渲染整窗）
        run: python -m sshdesk --selftest

      - name: 原生控件冒烟（Terminal / RemoteFiles）
        run: python tests/native_smoke.py

      - name: 断点续传专项（大文件上传/下载/续传/跳过/拖出）
        run: python tests/test_resume.py

      - name: 授权（签名/指纹/到期/宽限）
        run: python tests/test_license.py
