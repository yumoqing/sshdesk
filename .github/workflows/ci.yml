name: ci

on:
  push:
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 Qt 运行时依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-noto-cjk

      - name: 安装依赖（界面来自 bricks-qt）
        run: |
          python -m pip install -U pip
          pip install PySide6-Essentials pyte wcwidth json5 paramiko asyncssh jinja2
          pip install "git+https://github.com/yumoqing/pylice@main"
          pip install "git+https://github.com/yumoqing/bricks-qt@main"

      # session.py 依赖 appPublic.sshx；appPublic 自带一堆重依赖，CI 里只克隆取 sshx
      - name: 取 appPublic（sshx）
        shell: bash
        run: |
          git clone --depth 1 https://github.com/yumoqing/appPublic.git "$RUNNER_TEMP/appPublic"
          echo "SSHDESK_APPPUBLIC=$RUNNER_TEMP/appPublic" >> "$GITHUB_ENV"

      # 本地和 CI 用同一个入口：.ui 校验 → 窗口自检 → 原生冒烟 → 续传 → 授权 → 端到端
      - name: 全量检查（tests/run_all.py）
        run: python tests/run_all.py

      # 端到端那套偶发段错误是控件生命周期问题（见 817bf42），反复跑 3 轮守住它
      - name: 端到端稳定性（连跑 3 轮，防段错误回潮）
        run: python tests/run_all.py -k e2e --repeat 3
